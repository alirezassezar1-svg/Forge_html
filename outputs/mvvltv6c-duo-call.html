<style></style>
<title>دونفره</title>
<style data-anyhtml="">html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}</style></head>
<body>

<!-- خوش‌آمد -->
<section id="welcome" class="screen">
  <div class="logo" aria-hidden="true"><i></i><i></i></div>
  <h1>دونفره</h1>
  <p class="sub">چت و تماس خصوصی فقط برای شما دو نفر</p>
  <button id="btnCreate" class="primary">ساخت کد اتصال</button>
  <div class="or">یا</div>
  <form id="joinForm">
    <input id="codeIn" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="کد ۶ رقمی همسرت" aria-label="کد اتصال">
    <button class="secondary" type="submit">اتصال</button>
  </form>
  <p id="welcomeErr" class="err" role="alert"></p>
  <div id="installHint" class="hint" hidden=""></div>
</section>

<!-- انتظار -->
<section id="waiting" class="screen" hidden="">
  <p class="sub">این کد را به همسرت بده تا وارد کند</p>
  <div id="bigCode" class="bigcode" dir="ltr">------</div>
  <p class="sub small">تا ۱۰ دقیقه معتبر است. به‌محض ورود او، اتصال برقرار می‌شود.</p>
  <button id="btnCopy" class="secondary">کپی کد</button>
  <button id="btnCancel" class="ghost">انصراف</button>
</section>

<!-- چت -->
<section id="chat" class="screen chat" hidden="">
  <header>
    <button id="btnMenu" class="icon" aria-label="منو">⋮</button>
    <div class="who">
      <b>همسر</b>
      <small id="status" class="">آفلاین</small>
    </div>
    <button id="btnVideo" class="icon" aria-label="تماس تصویری">📹</button>
    <button id="btnAudio" class="icon" aria-label="تماس صوتی">📞</button>
  </header>
  <div id="list" class="list" aria-live="polite"></div>
  <form id="sendForm" class="composer">
    <textarea id="msgIn" rows="1" placeholder="پیام…" maxlength="4000" aria-label="پیام"></textarea>
    <button class="send" type="submit" aria-label="ارسال">➤</button>
  </form>
</section>

<!-- منو -->
<div id="sheet" class="sheet" hidden="">
  <div class="card">
    <h3>امنیت گفتگو</h3>
    <p class="small">اگر این اعداد روی هر دو گوشی یکی است، کسی وسط گفتگو نیست:</p>
    <div id="fp" class="fp" dir="ltr">—</div>
    <button id="btnNotif" class="secondary">فعال‌سازی اعلان</button>
    <button id="btnUnpair" class="danger">جدا کردن و پاک‌کردن گفتگو</button>
    <button id="btnCloseSheet" class="ghost">بستن</button>
  </div>
</div>

<!-- تماس ورودی -->
<div id="incoming" class="overlay" hidden="">
  <div class="avatar">♥</div>
  <h2>همسر</h2>
  <p id="incomingKind">تماس ورودی…</p>
  <div class="row">
    <button id="btnReject" class="round red" aria-label="رد">✕</button>
    <button id="btnAccept" class="round green" aria-label="پاسخ">✓</button>
  </div>
</div>

<!-- در تماس -->
<div id="call" class="overlay call" hidden="">
  <video id="remote" autoplay="" playsinline=""></video>
  <video id="local" autoplay="" playsinline="" muted=""></video>
  <div class="callinfo">
