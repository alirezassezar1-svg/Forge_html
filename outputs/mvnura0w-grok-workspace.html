        outline-color: color-mix(in oklab, var(--color-white) 10%, transparent);
      }
    }
    @media (hover: hover) {
      .dark\:hover\:bg-neutral-900:hover {
        background-color: var(--color-neutral-900);
      }
    }
  }
}

@layer base {
  button:not(:disabled), [role="button"]:not(:disabled) {
    cursor: pointer;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #07080c;
    color: #fff;
  }
  body {
    overflow: hidden;
    overscroll-behavior: none;
  }
}
.ali {
  --icon: 60px;
  --gap: max(8px, calc((100% - (var(--icon) * 4)) / 5));
  --blue: #0a84ff;
  --green: #30d158;
  --orange: #ff9f0a;
  --red: #ff453a;
  --muted: #8e8e93;
  --cell: #1c1c1e;
  --line: rgba(255, 255, 255, 0.1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Vazirmatn Variable", system-ui, sans-serif;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  height: 100dvh;
  width: 100%;
  display: grid;
  place-items: center;
  background: radial-gradient(900px 420px at 50% 110%, rgba(196, 164, 132, 0.16), transparent 60%), #07080c;
}
.stage {
  transform-origin: center center;
}
.chassis {
  position: relative;
  padding: 12px;
  border-radius: 68px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25), inset 0 0 0 3px rgba(0, 0, 0, 0.35), 0 30px 70px rgba(0, 0, 0, 0.45);
}
.chassis .screen {
  width: 440px;
  height: 956px;
  border-radius: 54px;
  box-shadow: inset 0 0 0 2px #000;
}
.side-btn {
  position: absolute;
  width: 4px;
  border-radius: 2px;
  border: 0;
  padding: 0;
}

.ck.fn {
  background: #a5a5a5;
  color: #111;
}
.ck.op {
  background: var(--orange);
  color: #fff;
}
.ck.eq {
  background: var(--orange);
}
.ck.zero {
  grid-column: span 2;
  aspect-ratio: auto;
  border-radius: 40px;
  text-align: left;
  padding-inline-start: 28px;
}
.bubble-row {
  display: flex;
  margin: 4px 12px;
}
.bubble-row.me {
  justify-content: flex-end;
}
.msg {
  max-width: 74%;
  padding: 8px 12px;
  border-radius: 18px;
  font-size: 16px;
  line-height: 1.35;
}
.bubble-row.me .msg {
  background: var(--blue);
}
.bubble-row.them .msg {
  background: #2c2c2e;
}
.composer {
  display: flex;
  gap: 8px;
  padding: 8px 12px 10px;
}
.composer input {
  flex: 1;
  background: #1c1c1e;
  border: 0;
  border-radius: 18px;
  color: #fff;
  font: inherit;
  font-size: 16px;
  padding: 10px 14px;
  outline: none;
}
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
}
.photo-grid button {
  border: 0;
  padding: 0;
  background: #111;
  aspect-ratio: 1;
}
.photo-grid img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hour-row {
  display: flex;
  gap: 8px;
  overflow: auto;
  padding: 0 16px 12px;
}
.hour-row div {
  min-width: 52px;
  text-align: center;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  padding: 8px 4px;
  font-size: 13px;
}
.wx-hero {
  padding: 12px 20px 8px;
}
.wx-hero .temp {
  font-size: 84px;
  font-weight: 250;
  letter-spacing: -3px;
  line-height: 0.9;
}
.map-frame {
  flex: 1;
  border: 0;
  width: 100%;
  background: #123;
}
.chips {
  display: flex;
  gap: 8px;
  overflow: auto;
  padding: 8px 12px;
}
.chips button {
  border: 0;
  background: #1c1c1e;
  color: #fff;
  border-radius: 16px;
  padding: 8px 12px;
  font: inherit;
  font-size: 14px;
  white-space: nowrap;
}
.chips button.on {
  background: var(--blue);
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 0 12px;
  direction: ltr;
}
.cal-grid button, .cal-grid i {
  aspect-ratio: 1;
  border: 0;
  background: none;
  color: #fff;
  font: inherit;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.cal-grid button.on {
  background: var(--blue);
}
.cal-grid button.today {
  box-shadow: inset 0 0 0 1px var(--red);
}
.wd {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  padding-bottom: 4px;
}
.switch {
  width: 51px;
  height: 31px;
  border-radius: 16px;
  border: 0;
  background: #39393d;
  position: relative;
  flex: none;
}
.switch.on {
  background: var(--green);
}
.switch i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.18s ease;
}
.switch.on i {
  transform: translateX(20px);
}
[dir="rtl"] .switch.on i {
  transform: translateX(20px);
}
.wall-pick {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 0 16px 16px;
}
.wall-pick button {
  border: 0;
  padding: 0;
  border-radius: 16px;
  overflow: hidden;
  height: 120px;
  background: #111;
  position: relative;
}
.wall-pick img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.wall-pick button.on {
  outline: 3px solid var(--blue);
}
.store-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 10px 16px;
}
.store-card .meta {
  flex: 1;
  min-width: 0;
}
.store-card b {
  display: block;
  font-size: 16px;
}
.store-card span {
  color: var(--muted);
  font-size: 13px;
}
.get {
  border: 0;
  background: #2c2c2e;
  color: var(--blue);
  font: inherit;
  font-weight: 700;
  border-radius: 16px;
  min-width: 74px;
  height: 30px;
  padding: 0 12px;
}
.get.open {
  color: #fff;
  background: var(--blue);
  font-weight: 650;
}
.rings {
  width: 180px;
  height: 180px;
  margin: 8px auto;
  display: block;
}
.pad-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 16px;
}
.pad {
  aspect-ratio: 1;
  border: 0;
  border-radius: 16px;
  font: inherit;
  color: #fff;
  font-weight: 700;
}
.sheet-grid {
  border-collapse: collapse;
  margin: 0 12px;
  direction: ltr;
}
.sheet-grid input {
  width: 72px;
  background: #1c1c1e;
  border: 0.5px solid #333;
  color: #fff;
  font: inherit;
  font-size: 14px;
  padding: 8px;
}
.board {
  position: relative;
  flex: 1;
  margin: 0 12px 12px;
  background: #141416;
  border-radius: 16px;
  overflow: hidden;
  min-height: 420px;
}
.sticky {
  position: absolute;
  width: 120px;
  min-height: 90px;
  border: 0;
  border-radius: 10px;
  padding: 8px;
  font: inherit;
  font-size: 14px;
  text-align: start;
  resize: none;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
}
.reader {
  padding: 8px 18px 24px;
  font-size: 18px;
  line-height: 1.7;
}
.level {
  height: 8px;
  margin: 16px;
  background: #2c2c2e;
  border-radius: 4px;
  position: relative;
}
.level b {
  position: absolute;
  top: -4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--green);
}
.finder {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  margin: 30px auto;
  border: 2px solid rgba(48, 209, 88, 0.7);
  position: relative;
  overflow: hidden;
}
.finder i {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 50%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #30d158);
  transform-origin: left center;
  animation: spin 2.4s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.alarm-banner {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 70px;
  z-index: 45;
  background: rgba(28, 28, 30, 0.92);
  border-radius: 20px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
}
.alarm-banner button {
  margin-top: 8px;
  border: 0;
  background: var(--orange);
  color: #111;
  font: inherit;
  font-weight: 700;
  border-radius: 12px;
  padding: 8px 16px;
}
.switcher {
  position: absolute;
  inset: 0;
  z-index: 15;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(24px);
  display: flex;
  gap: 14px;
  overflow: auto;
  padding: 80px 20px 40px;
  align-items: center;
}
.card-app {
  min-width: 210px;
  height: 420px;
  border-radius: 22px;
  border: 0;
  background: #1c1c1e center/cover no-repeat;
  color: #fff;
  font: inherit;
  position: relative;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
}
.card-app b {
  position: absolute;
  bottom: 14px;
  left: 0;
  right: 0;
}
.card-app .kill {
  position: absolute;
  top: -8px;
  inset-inline-end: -4px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #3a3a3c;
  color: #fff;
  border: 0;
}
.spot {
  position: absolute;
  inset: 0;
  z-index: 34;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(22px);
  padding: 64px 16px 20px;
}
.spot-hit {
  width: 100%;
  text-align: start;
  background: none;
  border: 0;
  color: #fff;
  font: inherit;
  padding: 10px 4px;
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 17px;
}
.cam-view {
  flex: 1;
  position: relative;
  background: #111;
  overflow: hidden;
}
.cam-view video, .cam-view canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.shutter {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 3px solid #fff;
  background: transparent;
  padding: 4px;
}
.shutter i {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #fff;
}
.viewer {
  position: absolute;
  inset: 0;
  background: #000;
  z-index: 5;
  display: flex;
  flex-direction: column;
}
.viewer img {
  flex: 1;
  object-fit: contain;
  width: 100%;
  min-height: 0;
}
.warn {
  margin: 8px 16px;
  color: #ffd60a;
  font-size: 13px;
}
.book-text {
  white-space: pre-wrap;
}
@media (prefers-reduced-motion: reduce) {
  .editing .ios-glyph, .chevron, .eq i, .finder i {
    animation: none !important;
  }
  .app, .sheet, .pager-track {
    animation: none !important;
    transition: none !important;
  }
}
