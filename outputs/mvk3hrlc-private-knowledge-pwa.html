}\n\n.progress-fill {\n  height: 100%;\n  background: var(--accent);\n  transition: width 0.3s ease;\n  border-radius: 3px;\n}\n\n/* ===== Citation ===== */\n.citation {\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  background: var(--accent-soft);\n  color: var(--accent);\n  padding: 2px 8px;\n  border-radius: 4px;\n  font-size: 0.8rem;\n  text-decoration: none;\n  margin: 2px;\n  cursor: pointer;\n}\n\n.citation:hover {\n  background: var(--accent);\n  color: var(--text-inverse);\n}\n\n/* ===== Utility ===== */\n.hidden { display: none !important; }\n.text-center { text-align: center; }\n.mt-1 { margin-top: 8px; }\n.mt-2 { margin-top: 16px; }\n.mt-3 { margin-top: 24px; }\n.mb-1 { margin-bottom: 8px; }\n.mb-2 { margin-bottom: 16px; }\n.flex { display: flex; }\n.flex-between { display: flex; justify-content: space-between; align-items: center; }\n.gap-1 { gap: 8px; }\n.gap-2 { gap: 16px; }\n","truncated":false},{"path":"css/rtl.css","size":1492,"mime":"text/css","ext":"css","kind":"text","text":"/* RTL-specific adjustments */\n\nhtml[dir=\"rtl\"] {\n  direction: rtl;\n}\n\n/* Keep URLs, code, numbers LTR */\n.ltr, a[href^=\"http\"], code, .url, .hash, .mono {\n  direction: ltr;\n  unicode-bidi: isolate;\n  text-align: left;\n}\n\n/* Form inputs that contain URLs should be LTR */\ninput[type=\"url\"],\ninput.url-input {\n  direction: ltr;\n  text-align: left;\n}\n\n/* Navigation labels stay RTL */\n.nav-label {\n  font-family: var(--font-fa);\n}\n\n/* Message bubbles: user on right in RTL? Actually for chat we keep user on start (right in RTL) */\nhtml[dir=\"rtl\"] .message-user {\n  align-self: flex-start; /* right side in RTL */\n  border-radius: var(--radius-md);\n  border-bottom-left-radius: 4px;\n  border-bottom-right-radius: var(--radius-md);\n}\n\nhtml[dir=\"rtl\"] .message-assistant {\n  align-self: flex-end; /* left side in RTL */\n  border-radius: var(--radius-md);\n  border-bottom-right-radius: 4px;\n  border-bottom-left-radius: var(--radius-md);\n}\n\n/* Toast border on the correct side */\nhtml[dir=\"rtl\"] .toast-success { border-right: none; border-left: 4px solid var(--success); }\nhtml[dir=\"rtl\"] .toast-error   { border-right: none; border-left: 4px solid var(--danger); }\nhtml[dir=\"rtl\"] .toast-info    { border-right: none; border-left: 4px solid var(--info); }\n\n/* Desktop sidebar on the right in RTL */\n@media (min-width: 768px) {\n  html[dir=\"rtl\"] .main-nav {\n    border-left: none;\n    border-right: 1px solid var(--border);\n    order: 1;\n  }\n  html[dir=\"rtl\"] .main-content {\n    order: 0;\n  }\n}\n","truncated":false},{"path":"css/themes.css","size":1719,"mime":"text/css","ext":"css","kind":"text","text":"/* ===== Light Theme (default) ===== */\n:root, [data-theme=\"light\"] {\n  --bg-primary: #f8fafc;\n  --bg-secondary: #ffffff;\n  --bg-tertiary: #f1f5f9;\n  --bg-hover: #e2e8f0;\n  --bg-card: #ffffff;\n\n  --text-primary: #0f172a;\n  --text-secondary: #64748b;\n  --text-muted: #94a3b8;\n  --text-inverse: #ffffff;\n\n  --border: #e2e8f0;\n  --border-strong: #cbd5e1;\n\n  --accent: #3b82f6;\n  --accent-hover: #2563eb;\n  --accent-soft: #dbeafe;\n\n  --success: #10b981;\n  --warning: #f59e0b;\n  --danger: #ef4444;\n  --info: #06b6d4;\n\n  --shadow-color: rgba(15, 23, 42, 0.08);\n}\n\n/* ===== Dark Theme ===== */\n[data-theme=\"dark\"] {\n  --bg-primary: #0f172a;\n  --bg-secondary: #1e293b;\n  --bg-tertiary: #334155;\n  --bg-hover: #475569;\n  --bg-card: #1e293b;\n\n  --text-primary: #f1f5f9;\n  --text-secondary: #94a3b8;\n  --text-muted: #64748b;\n  --text-inverse: #0f172a;\n\n  --border: #334155;\n  --border-strong: #475569;\n\n  --accent: #60a5fa;\n  --accent-hover: #3b82f6;\n  --accent-soft: #1e3a5f;\n\n  --success: #34d399;\n  --warning: #fbbf24;\n  --danger: #f87171;\n  --info: #22d3ee;\n\n  --shadow-color: rgba(0, 0, 0, 0.3);\n}\n\n/* Auto dark preference */\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg-primary: #0f172a;\n    --bg-secondary: #1e293b;\n    --bg-tertiary: #334155;\n    --bg-hover: #475569;\n    --bg-card: #1e293b;\n\n    --text-primary: #f1f5f9;\n    --text-secondary: #94a3b8;\n    --text-muted: #64748b;\n    --text-inverse: #0f172a;\n\n    --border: #334155;\n    --border-strong: #475569;\n\n    --accent: #60a5fa;\n    --accent-hover: #3b82f6;\n    --accent-soft: #1e3a5f;\n\n    --success: #34d399;\n    --warning: #fbbf24;\n    --danger: #f87171;\n    --info: #22d3ee;\n\n    --shadow-color: rgba(0, 0, 0, 0.3);\n  }\n}\n","truncated":false},{"path":"icons/icon-192-maskable.png","size":67,"mime":"image/png","ext":"png","kind":"image","b64":"iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAIAAACezh6TAAAADElEQVR4nGP4DwABAQEAGN2NtAAAAABJRU5ErkJggg=="},{"path":"icons/icon-192.png","size":67,"mime":"image/png","ext":"png","kind":"image","b64":"iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAIAAACezh6TAAAADElEQVR4nGP4DwABAQEAGN2NtAAAAABJRU5ErkJggg=="},{"path":"icons/icon-512-maskable.png","size":67,"mime":"image/png","ext":"png","kind":"image","b64":"iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAIAAACezh6TAAAADElEQVR4nGP4DwABAQEAGN2NtAAAAABJRU5ErkJggg=="},{"path":"icons/icon-512.png","size":67,"mime":"image/png","ext":"png","kind":"image","b64":"iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAIAAACezh6TAAAADElEQVR4nGP4DwABAQEAGN2NtAAAAABJRU5ErkJggg=="},{"path":"index.html","size":3607,"mime":"text/html","ext":"html","kind":"text","text":"\u003c!DOCTYPE html>\n\u003chtml lang=\"fa\" dir=\"rtl\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1\" />\n  \u003cmeta name=\"theme-color\" content=\"#0f172a\" />\n  \u003cmeta name=\"apple-mobile-web-app-capable\" content=\"yes\" />\n  \u003cmeta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\" />\n  \u003cmeta name=\"apple-mobile-web-app-title\" content=\"دانش خصوصی\" />\n  \u003ctitle>دانش خصوصی — Private Knowledge\u003c/title>\n  \u003clink rel=\"manifest\" href=\"/manifest.webmanifest\" />\n  \u003clink rel=\"apple-touch-icon\" href=\"/icons/icon-192.png\" />\n  \u003clink rel=\"stylesheet\" href=\"/css/base.css\" />\n  \u003clink rel=\"stylesheet\" href=\"/css/themes.css\" />\n  \u003clink rel=\"stylesheet\" href=\"/css/components.css\" />\n  \u003clink rel=\"stylesheet\" href=\"/css/rtl.css\" />\n\u003c/head>\n\u003cbody>\n  \u003cdiv id=\"app\">\n    \u003c!-- Offline / Status Bar -->\n    \u003cdiv id=\"status-bar\" class=\"status-bar hidden\">\n      \u003cspan id=\"status-text\">آفلاین\u003c/span>\n    \u003c/div>\n\n    \u003c!-- App Shell -->\n    \u003cdiv class=\"app-shell\">\n      \u003c!-- Sidebar (desktop) / Bottom Nav (mobile) -->\n      \u003cnav id=\"main-nav\" class=\"main-nav\" aria-label=\"منوی اصلی\">\n        \u003ca href=\"/\" data-route=\"/\" class=\"nav-item active\" title=\"داشبورد\">\n          \u003cspan class=\"nav-icon\">⌂\u003c/span>\n          \u003cspan class=\"nav-label\">داشبورد\u003c/span>\n        \u003c/a>\n        \u003ca href=\"/chat\" data-route=\"/chat\" class=\"nav-item\" title=\"گفتگو\">\n          \u003cspan class=\"nav-icon\">💬\u003c/span>\n          \u003cspan class=\"nav-label\">گفتگو\u003c/span>\n        \u003c/a>\n        \u003ca href=\"/sources\" data-route=\"/sources\" class=\"nav-item\" title=\"منابع\">\n          \u003cspan class=\"nav-icon\">📚\u003c/span>\n          \u003cspan class=\"nav-label\">منابع\u003c/span>\n        \u003c/a>\n        \u003ca href=\"/ingest\" data-route=\"/ingest\" class=\"nav-item\" title=\"افزودن\">\n          \u003cspan class=\"nav-icon\">＋\u003c/span>\n          \u003cspan class=\"nav-label\">افزودن\u003c/span>\n        \u003c/a>\n        \u003ca href=\"/search\" data-route=\"/search\" class=\"nav-item\" title=\"جستجو\">\n          \u003cspan class=\"nav-icon\">🔍\u003c/span>\n          \u003cspan class=\"nav-label\">جستجو\u003c/span>\n        \u003c/a>\n        \u003ca href=\"/settings\" data-route=\"/settings\" class=\"nav-item\" title=\"تنظیمات\">\n          \u003cspan class=\"nav-icon\">⚙\u003c/span>\n          \u003cspan class=\"nav-label\">تنظیمات\u003c/span>\n        \u003c/a>\n      \u003c/nav>\n\n      \u003c!-- Main Content -->\n      \u003cmain id=\"main-content\" class=\"main-content\" role=\"main\">\n        \u003cdiv id=\"page-container\">\n          \u003c!-- Pages are injected here by the router -->\n          \u003cdiv class=\"loading-screen\">\n            \u003cdiv class=\"spinner\">\u003c/div>\n            \u003cp>در حال بارگذاری...\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/main>\n    \u003c/div>\n\n    \u003c!-- Toast / Notifications -->\n    \u003cdiv id=\"toast-container\" class=\"toast-container\" aria-live=\"polite\">\u003c/div>\n\n    \u003c!-- Modal Root -->\n    \u003cdiv id=\"modal-root\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- Libraries (CDN for simplicity in this version) -->\n  \u003cscript src=\"https://cdn.jsdelivr.net/npm/dexie@3.2.7/dist/dexie.min.js\">\u003c/script>\n  \u003cscript src=\"https://cdn.jsdelivr.net/npm/minisearch@6.3.0/dist/umd/index.min.js\">\u003c/script>\n\n  \u003c!-- App Modules -->\n  \u003cscript type=\"module\" src=\"/js/app.js\">\u003c/script>\n\n  \u003cscript>\n    // Register Service Worker\n    if ('serviceWorker' in navigator) {\n      window.addEventListener('load', () => {\n        navigator.serviceWorker.register('/sw.js')\n          .then(reg => console.log('SW registered', reg.scope))\n          .catch(err => console.warn('SW registration failed', err));\n      });\n    }\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n","truncated":false},{"path":"js/app.js","size":2292,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Private Knowledge AI – Client-Only PWA\n * Entry Point\n */\nimport { initDB, getSetting } from './db/db.js';\nimport { initRouter, register } from './router.js';\nimport { renderDashboard } from './pages/dashboard.js';\nimport { renderIngest } from './pages/ingest.js';\nimport { renderSources } from './pages/sources.js';\nimport { renderChat } from './pages/chat.js';\nimport { renderSearch } from './pages/search.js';\nimport { renderSettings, applyTheme } from './pages/settings.js';\nimport { buildIndex } from './services/retriever.js';\n\nasync function bootstrap() {\n  try {\n    // 1. Init DB\n    await initDB();\n\n    // 2. Apply theme\n    const theme = await getSetting('theme');\n    applyTheme(theme || 'auto');\n\n    // 3. Register routes\n    register('/', renderDashboard);\n    register('/ingest', renderIngest);\n    register('/sources', renderSources);\n    register('/chat', renderChat);\n    register('/search', renderSearch);\n    register('/settings', renderSettings);\n\n    // 4. Init router\n    initRouter('#page-container');\n\n    // 5. Build search index in background\n    buildIndex().catch(err => console.warn('Index build failed', err));\n\n    // 6. Online/Offline status\n    updateOnlineStatus();\n    window.addEventListener('online', updateOnlineStatus);\n    window.addEventListener('offline', updateOnlineStatus);\n\n    console.log('[App] Private Knowledge AI ready (Client-Only)');\n  } catch (err) {\n    console.error('[App] Bootstrap failed', err);\n    document.getElementById('page-container').innerHTML = `\n      \u003cdiv class=\"empty-state\">\n        \u003cdiv class=\"empty-state-icon\">⚠️\u003c/div>\n        \u003ch3>خطا در راه‌اندازی\u003c/h3>\n        \u003cp>${err.message}\u003c/p>\n        \u003cp class=\"mt-1\">لطفاً صفحه را رفرش کنید یا حافظه مرورگر را پاک کنید.\u003c/p>\n      \u003c/div>\n    `;\n  }\n}\n\nfunction updateOnlineStatus() {\n  const bar = document.getElementById('status-bar');\n  const text = document.getElementById('status-text');\n  if (!bar || !text) return;\n\n  if (navigator.onLine) {\n    bar.classList.add('hidden');\n  } else {\n    bar.classList.remove('hidden');\n    bar.classList.remove('online');\n    text.textContent = 'حالت آفلاین — فقط دانش ذخیره‌شده در دسترس است';\n  }\n}\n\n// Start\nbootstrap();\n","truncated":false},{"path":"js/db/db.js","size":7409,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Database layer using Dexie.js\n */\nimport { DB_NAME, DB_VERSION, stores, defaultSettings } from './schema.js';\n\nconst db = new Dexie(DB_NAME);\n\ndb.version(DB_VERSION).stores(stores);\n\n/**\n * Initialize database and default settings\n */\nexport async function initDB() {\n  try {\n    await db.open();\n    // Ensure default settings exist\n    const existing = await db.settings.get('theme');\n    if (!existing) {\n      const entries = Object.entries(defaultSettings).map(([key, value]) => ({ key, value }));\n      await db.settings.bulkPut(entries);\n    }\n    console.log('[DB] Initialized successfully');\n    return true;\n  } catch (err) {\n    console.error('[DB] Init failed', err);\n    throw err;\n  }\n}\n\n/**\n * Settings helpers\n */\nexport async function getSetting(key) {\n  const row = await db.settings.get(key);\n  return row ? row.value : defaultSettings[key];\n}\n\nexport async function setSetting(key, value) {\n  await db.settings.put({ key, value });\n}\n\nexport async function getAllSettings() {\n  const rows = await db.settings.toArray();\n  const obj = { ...defaultSettings };\n  rows.forEach(r => { obj[r.key] = r.value; });\n  return obj;\n}\n\n/**\n * Sources\n */\nexport async function createSource({ url, finalUrl, title }) {\n  const now = Date.now();\n  const id = await db.sources.add({\n    url,\n    finalUrl: finalUrl || url,\n    title: title || url,\n    createdAt: now,\n    updatedAt: now,\n    status: 'pending',\n    tags: []\n  });\n  return id;\n}\n\nexport async function getSources() {\n  return db.sources.orderBy('updatedAt').reverse().toArray();\n}\n\nexport async function getSource(id) {\n  return db.sources.get(id);\n}\n\nexport async function updateSource(id, changes) {\n  changes.updatedAt = Date.now();\n  await db.sources.update(id, changes);\n}\n\n/**\n * Versions (immutable after creation except approval)\n */\nexport async function createVersion(data) {\n  const existing = await db.versions\n    .where({ sourceId: data.sourceId })\n    .toArray();\n  const versionNumber = existing.length + 1;\n\n  const id = await db.versions.add({\n    sourceId: data.sourceId,\n    versionNumber,\n    contentHash: data.contentHash,\n    title: data.title,\n    extractedText: data.extractedText,\n    qualityReport: data.qualityReport,\n    retrievedAt: data.retrievedAt || Date.now(),\n    httpStatus: data.httpStatus,\n    contentType: data.contentType,\n    finalUrl: data.finalUrl,\n    approved: false,\n    approvedAt: null,\n    status: 'preview',\n    extractionMethod: data.extractionMethod || 'readability-v1'\n  });\n  return id;\n}\n\nexport async function getVersions(sourceId) {\n  return db.versions.where('sourceId').equals(sourceId).reverse().sortBy('versionNumber');\n}\n\nexport async function getVersion(id) {\n  return db.versions.get(id);\n}\n\nexport async function approveVersion(versionId) {\n  const version = await db.versions.get(versionId);\n  if (!version) throw new Error('Version not found');\n\n  await db.transaction('rw', db.versions, db.sources, async () => {\n    await db.versions.update(versionId, {\n      approved: true,\n      approvedAt: Date.now(),\n      status: 'approved'\n    });\n    await db.sources.update(version.sourceId, {\n      status: 'active',\n      title: version.title,\n      updatedAt: Date.now()\n    });\n  });\n}\n\n/**\n * Chunks\n */\nexport async function saveChunks(versionId, sourceId, chunks) {\n  const records = chunks.map((c, i) => ({\n    versionId,\n    sourceId,\n    order: i,\n    heading: c.heading || null,\n    text: c.text,\n    textLength: c.text.length,\n    startOffset: c.startOffset || 0,\n    endOffset: c.endOffset || c.text.length\n  }));\n  await db.chunks.bulkAdd(records);\n  return records.length;\n}\n\nexport async function getChunksByVersion(versionId) {\n  return db.chunks.where('versionId').equals(versionId).sortBy('order');\n}\n\nexport async function getApprovedChunks() {\n  const approvedVersions = await db.versions.where('approved').equals(1).primaryKeys();\n  if (!approvedVersions.length) return [];\n  return db.chunks.where('versionId').anyOf(approvedVersions).toArray();\n}\n\n/**\n * Conversations & Messages\n */\nexport async function createConversation(title = 'گفتگوی جدید') {\n  const now = Date.now();\n  return db.conversations.add({\n    title,\n    createdAt: now,\n    updatedAt: now\n  });\n}\n\nexport async function getConversations() {\n  return db.conversations.orderBy('updatedAt').reverse().toArray();\n}\n\nexport async function addMessage(conversationId, role, content, meta = {}) {\n  const id = await db.messages.add({\n    conversationId,\n    role,\n    content,\n    createdAt: Date.now(),\n    ...meta\n  });\n  await db.conversations.update(conversationId, { updatedAt: Date.now() });\n  return id;\n}\n\nexport async function getMessages(conversationId) {\n  return db.messages.where('conversationId').equals(conversationId).sortBy('createdAt');\n}\n\n/**\n * Evidence\n */\nexport async function saveEvidence(messageId, items) {\n  const records = items.map(item => ({\n    messageId,\n    chunkId: item.chunkId,\n    versionId: item.versionId,\n    score: item.score,\n    excerpt: item.excerpt\n  }));\n  await db.evidence.bulkAdd(records);\n}\n\nexport async function getEvidence(messageId) {\n  return db.evidence.where('messageId').equals(messageId).toArray();\n}\n\n/**\n * Jobs\n */\nexport async function createJob(type, payload = {}) {\n  return db.jobs.add({\n    type,\n    status: 'pending',\n    progress: 0,\n    payload,\n    result: null,\n    error: null,\n    createdAt: Date.now(),\n    updatedAt: Date.now()\n  });\n}\n\nexport async function updateJob(id, changes) {\n  changes.updatedAt = Date.now();\n  await db.jobs.update(id, changes);\n}\n\nexport async function getJob(id) {\n  return db.jobs.get(id);\n}\n\n/**\n * Export / Import helpers\n */\nexport async function exportAllData() {\n  const data = {\n    exportedAt: new Date().toISOString(),\n    version: DB_VERSION,\n    settings: await db.settings.toArray(),\n    sources: await db.sources.toArray(),\n    versions: await db.versions.toArray(),\n    chunks: await db.chunks.toArray(),\n    conversations: await db.conversations.toArray(),\n    messages: await db.messages.toArray(),\n    evidence: await db.evidence.toArray()\n  };\n  return data;\n}\n\nexport async function importData(data) {\n  if (!data || !data.version) throw new Error('Invalid backup file');\n\n  await db.transaction('rw',\n    db.settings, db.sources, db.versions, db.chunks,\n    db.conversations, db.messages, db.evidence,\n    async () => {\n      await Promise.all([\n        db.settings.clear(),\n        db.sources.clear(),\n        db.versions.clear(),\n        db.chunks.clear(),\n        db.conversations.clear(),\n        db.messages.clear(),\n        db.evidence.clear()\n      ]);\n\n      if (data.settings?.length) await db.settings.bulkPut(data.settings);\n      if (data.sources?.length) await db.sources.bulkPut(data.sources);\n      if (data.versions?.length) await db.versions.bulkPut(data.versions);\n      if (data.chunks?.length) await db.chunks.bulkPut(data.chunks);\n      if (data.conversations?.length) await db.conversations.bulkPut(data.conversations);\n      if (data.messages?.length) await db.messages.bulkPut(data.messages);\n      if (data.evidence?.length) await db.evidence.bulkPut(data.evidence);\n    }\n  );\n}\n\nexport async function wipeAllData() {\n  await db.delete();\n  await db.open();\n  const entries = Object.entries(defaultSettings).map(([key, value]) => ({ key, value }));\n  await db.settings.bulkPut(entries);\n}\n\nexport { db };\nexport default db;\n","truncated":false},{"path":"js/db/schema.js","size":1106,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * IndexedDB Schema Definition for Private Knowledge AI (Client-Only)\n */\n\nexport const DB_NAME = 'PrivateKnowledgeDB';\nexport const DB_VERSION = 1;\n\n/**\n * Dexie schema stores\n */\nexport const stores = {\n  settings: 'key, value',\n  sources: '++id, url, finalUrl, title, createdAt, updatedAt, status, *tags',\n  versions: '++id, sourceId, versionNumber, contentHash, title, retrievedAt, approved, approvedAt, status',\n  chunks: '++id, versionId, sourceId, order, heading, textLength',\n  embeddings: '++id, chunkId, versionId, model',\n  conversations: '++id, title, createdAt, updatedAt',\n  messages: '++id, conversationId, role, createdAt',\n  evidence: '++id, messageId, chunkId, versionId, score',\n  jobs: '++id, type, status, createdAt, updatedAt',\n  audit: '++id, action, timestamp'\n};\n\n/**\n * Default settings\n */\nexport const defaultSettings = {\n  theme: 'auto',\n  language: 'fa',\n  embeddingModel: 'Xenova/all-MiniLM-L6-v2',\n  llmModel: null,               // set when WebLLM is loaded\n  chunkSize: 500,\n  chunkOverlap: 80,\n  topK: 6,\n  pinEnabled: false,\n  pinHash: null,\n  lastBackupAt: null\n};\n","truncated":false},{"path":"js/pages/chat.js","size":6517,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Chat Page – Evidence-based answers using local retrieval\n */\nimport {\n  createConversation,\n  getConversations,\n  addMessage,\n  getMessages,\n  saveEvidence\n} from '../db/db.js';\nimport { search, buildContext } from '../services/retriever.js';\nimport { showToast } from '../utils/toast.js';\n\nlet currentConversationId = null;\n\nexport async function renderChat() {\n  const container = document.getElementById('page-container');\n\n  // Get or create a conversation\n  let conversations = await getConversations();\n  if (conversations.length === 0) {\n    currentConversationId = await createConversation('گفتگوی اصلی');\n  } else {\n    currentConversationId = conversations[0].id;\n  }\n\n  const messages = await getMessages(currentConversationId);\n\n  container.innerHTML = `\n    \u003cdiv class=\"page-header\">\n      \u003ch1 class=\"page-title\">گفتگو با دانش\u003c/h1>\n      \u003cp class=\"page-subtitle\">پاسخ‌ها بر اساس منابع تأییدشده شما تولید می‌شوند\u003c/p>\n    \u003c/div>\n\n    \u003cdiv id=\"chat-messages\" class=\"chat-messages\">\n      ${messages.length === 0 ? `\n        \u003cdiv class=\"empty-state\">\n          \u003cdiv class=\"empty-state-icon\">💬\u003c/div>\n          \u003ch3>هنوز پیامی نیست\u003c/h3>\n          \u003cp>سؤال خود را در مورد منابع ذخیره‌شده بپرسید.\u003c/p>\n        \u003c/div>\n      ` : messages.map(m => renderMessage(m)).join('')}\n    \u003c/div>\n\n    \u003cdiv class=\"chat-input-bar\">\n      \u003cinput type=\"text\" id=\"chat-input\" class=\"form-input\"\n             placeholder=\"سؤال خود را بنویسید...\" autocomplete=\"off\" />\n      \u003cbutton id=\"btn-send\" class=\"btn btn-primary\">ارسال\u003c/button>\n    \u003c/div>\n  `;\n\n  const input = document.getElementById('chat-input');\n  const btn = document.getElementById('btn-send');\n\n  btn.addEventListener('click', () => sendMessage());\n  input.addEventListener('keydown', (e) => {\n    if (e.key === 'Enter' && !e.shiftKey) {\n      e.preventDefault();\n      sendMessage();\n    }\n  });\n\n  // Scroll to bottom\n  scrollToBottom();\n}\n\nfunction renderMessage(m) {\n  const cls = m.role === 'user' ? 'message-user' : 'message-assistant';\n  return `\n    \u003cdiv class=\"message ${cls}\" data-id=\"${m.id}\">\n      \u003cdiv>${escapeHtml(m.content)}\u003c/div>\n      \u003cdiv class=\"message-meta\">${formatTime(m.createdAt)}\u003c/div>\n    \u003c/div>\n  `;\n}\n\nasync function sendMessage() {\n  const input = document.getElementById('chat-input');\n  const btn = document.getElementById('btn-send');\n  const text = input.value.trim();\n  if (!text) return;\n\n  input.value = '';\n  btn.disabled = true;\n\n  // Add user message\n  const userMsgId = await addMessage(currentConversationId, 'user', text);\n  appendMessage({ id: userMsgId, role: 'user', content: text, createdAt: Date.now() });\n\n  // Show thinking\n  const thinkingId = 'thinking-' + Date.now();\n  const messagesEl = document.getElementById('chat-messages');\n  messagesEl.insertAdjacentHTML('beforeend', `\n    \u003cdiv class=\"message message-assistant\" id=\"${thinkingId}\">\n      \u003cdiv>در حال جستجو در دانش...\u003c/div>\n    \u003c/div>\n  `);\n  scrollToBottom();\n\n  try {\n    // Retrieve\n    const { results, mode, message } = await search(text, { topK: 5 });\n\n    let answer;\n    let evidenceItems = [];\n\n    if (!results.length) {\n      answer = message || 'متأسفانه در منابع تأییدشده شما مدرک کافی برای پاسخ به این سؤال پیدا نشد. لطفاً منابع مرتبط بیشتری اضافه کنید.';\n    } else {\n      // Build a simple evidence-based answer (no real LLM in this base version)\n      // In a full version this would call WebLLM with the context\n      const context = buildContext(results);\n      answer = generateSimpleAnswer(text, results);\n      evidenceItems = results.map(r => ({\n        chunkId: r.chunkId,\n        versionId: r.versionId,\n        score: r.score,\n        excerpt: r.excerpt\n      }));\n    }\n\n    // Remove thinking\n    document.getElementById(thinkingId)?.remove();\n\n    // Save assistant message\n    const assistantMsgId = await addMessage(currentConversationId, 'assistant', answer);\n    if (evidenceItems.length) {\n      await saveEvidence(assistantMsgId, evidenceItems);\n    }\n\n    // Render with citations\n    const msgEl = document.createElement('div');\n    msgEl.className = 'message message-assistant';\n    msgEl.dataset.id = assistantMsgId;\n    msgEl.innerHTML = `\n      \u003cdiv>${escapeHtml(answer)}\u003c/div>\n      ${results.length ? `\n        \u003cdiv class=\"mt-1\">\n          ${results.map((r, i) => `\n            \u003cspan class=\"citation\" title=\"${escapeHtml(r.sourceTitle)}\">\n              [${i + 1}] ${escapeHtml(r.sourceTitle.substring(0, 30))}\n            \u003c/span>\n          `).join('')}\n        \u003c/div>\n      ` : ''}\n      \u003cdiv class=\"message-meta\">${formatTime(Date.now())}\u003c/div>\n    `;\n    messagesEl.appendChild(msgEl);\n    scrollToBottom();\n\n  } catch (err) {\n    document.getElementById(thinkingId)?.remove();\n    showToast('خطا در تولید پاسخ: ' + err.message, 'error');\n  } finally {\n    btn.disabled = false;\n    input.focus();\n  }\n}\n\n/**\n * Simple extractive answer generator (placeholder for real local LLM)\n */\nfunction generateSimpleAnswer(question, results) {\n  if (!results.length) {\n    return 'مدرک کافی یافت نشد.';\n  }\n\n  let answer = `بر اساس ${results.length} بخش مرتبط از منابع شما:\\n\\n`;\n\n  results.slice(0, 3).forEach((r, i) => {\n    answer += `${i + 1}. از «${r.sourceTitle}»:\\n${r.excerpt}\\n\\n`;\n  });\n\n  answer += '---\\nتوجه: این پاسخ استخراجی از منابع شماست. برای پاسخ‌های تولیدی پیشرفته‌تر می‌توانید مدل زبانی محلی (WebLLM) را فعال کنید.';\n\n  return answer;\n}\n\nfunction appendMessage(m) {\n  const messagesEl = document.getElementById('chat-messages');\n  // Remove empty state if present\n  const empty = messagesEl.querySelector('.empty-state');\n  if (empty) empty.remove();\n\n  messagesEl.insertAdjacentHTML('beforeend', renderMessage(m));\n  scrollToBottom();\n}\n\nfunction scrollToBottom() {\n  const el = document.getElementById('chat-messages');\n  if (el) el.scrollTop = el.scrollHeight;\n}\n\nfunction formatTime(ts) {\n  return new Date(ts).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });\n}\n\nfunction escapeHtml(str) {\n  if (!str) return '';\n  return String(str)\n    .replace(/&/g, '&amp;')\n    .replace(/\u003c/g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;')\n    .replace(/\\n/g, '\u003cbr>');\n}\n","truncated":false},{"path":"js/pages/dashboard.js","size":3261,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Dashboard Page\n */\nimport { getSources, getConversations } from '../db/db.js';\n\nexport async function renderDashboard() {\n  const sources = await getSources();\n  const conversations = await getConversations();\n  const approvedCount = sources.filter(s => s.status === 'active').length;\n\n  const container = document.getElementById('page-container');\n  container.innerHTML = `\n    \u003cdiv class=\"page-header\">\n      \u003ch1 class=\"page-title\">داشبورد\u003c/h1>\n      \u003cp class=\"page-subtitle\">دانش شخصی کاملاً محلی\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-header\">\n        \u003cdiv>\n          \u003cdiv class=\"card-title\">خلاصه وضعیت\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card-body\">\n        \u003cdiv class=\"flex gap-2\" style=\"flex-wrap: wrap;\">\n          \u003cdiv style=\"flex:1; min-width:120px;\">\n            \u003cdiv style=\"font-size:1.8rem; font-weight:700; color:var(--accent);\">${sources.length}\u003c/div>\n            \u003cdiv class=\"card-meta\">کل منابع\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"flex:1; min-width:120px;\">\n            \u003cdiv style=\"font-size:1.8rem; font-weight:700; color:var(--success);\">${approvedCount}\u003c/div>\n            \u003cdiv class=\"card-meta\">تأیید شده\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"flex:1; min-width:120px;\">\n            \u003cdiv style=\"font-size:1.8rem; font-weight:700;\">${conversations.length}\u003c/div>\n            \u003cdiv class=\"card-meta\">گفتگوها\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-header\">\n        \u003cdiv class=\"card-title\">شروع سریع\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card-body\">\n        \u003cp class=\"mb-2\">برای شروع یک آدرس وب اضافه کنید یا سؤال بپرسید.\u003c/p>\n        \u003cdiv class=\"flex gap-1\" style=\"flex-wrap:wrap;\">\n          \u003ca href=\"/ingest\" data-route=\"/ingest\" class=\"btn btn-primary\">افزودن منبع\u003c/a>\n          \u003ca href=\"/chat\" data-route=\"/chat\" class=\"btn btn-secondary\">شروع گفتگو\u003c/a>\n          \u003ca href=\"/sources\" data-route=\"/sources\" class=\"btn btn-ghost\">مشاهده منابع\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    ${sources.length === 0 ? `\n      \u003cdiv class=\"empty-state\">\n        \u003cdiv class=\"empty-state-icon\">📚\u003c/div>\n        \u003ch3>هنوز منبعی ندارید\u003c/h3>\n        \u003cp>اولین آدرس وب خود را اضافه کنید تا دانش خصوصی‌تان شکل بگیرد.\u003c/p>\n      \u003c/div>\n    ` : `\n      \u003ch2 style=\"font-size:1.1rem; margin:20px 0 12px;\">آخرین منابع\u003c/h2>\n      ${sources.slice(0, 5).map(s => `\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"card-header\">\n            \u003cdiv>\n              \u003cdiv class=\"card-title\">${escapeHtml(s.title || s.url)}\u003c/div>\n              \u003cdiv class=\"card-meta ltr\">${escapeHtml(s.finalUrl || s.url)}\u003c/div>\n            \u003c/div>\n            \u003cspan class=\"badge ${s.status === 'active' ? 'badge-success' : 'badge-warning'}\">\n              ${s.status === 'active' ? 'فعال' : 'در انتظار'}\n            \u003c/span>\n          \u003c/div>\n        \u003c/div>\n      `).join('')}\n    `}\n  `;\n}\n\nfunction escapeHtml(str) {\n  if (!str) return '';\n  return str.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n}\n","truncated":false},{"path":"js/pages/ingest.js","size":5991,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Ingestion / Add Source Page\n */\nimport { previewUrl, savePreview } from '../services/ingestion.js';\nimport { approveVersion } from '../db/db.js';\nimport { indexVersion } from '../services/retriever.js';\nimport { showToast } from '../utils/toast.js';\n\nlet currentPreview = null;\nlet currentVersionId = null;\n\nexport async function renderIngest() {\n  const container = document.getElementById('page-container');\n  container.innerHTML = `\n    \u003cdiv class=\"page-header\">\n      \u003ch1 class=\"page-title\">افزودن منبع\u003c/h1>\n      \u003cp class=\"page-subtitle\">آدرس وب مورد نظر را وارد کنید\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"form-group\">\n        \u003clabel class=\"form-label\" for=\"url-input\">آدرس صفحه\u003c/label>\n        \u003cinput type=\"url\" id=\"url-input\" class=\"form-input url-input\"\n               placeholder=\"https://example.com/article\" dir=\"ltr\" />\n        \u003cp class=\"form-hint\">فقط آدرس‌هایی که خودتان انتخاب می‌کنید پردازش می‌شوند.\u003c/p>\n      \u003c/div>\n      \u003cbutton id=\"btn-preview\" class=\"btn btn-primary btn-block\">بررسی و استخراج\u003c/button>\n    \u003c/div>\n\n    \u003cdiv id=\"preview-area\" class=\"hidden\">\u003c/div>\n  `;\n\n  document.getElementById('btn-preview').addEventListener('click', handlePreview);\n  document.getElementById('url-input').addEventListener('keydown', (e) => {\n    if (e.key === 'Enter') handlePreview();\n  });\n}\n\nasync function handlePreview() {\n  const input = document.getElementById('url-input');\n  const btn = document.getElementById('btn-preview');\n  const area = document.getElementById('preview-area');\n\n  const url = input.value.trim();\n  if (!url) {\n    showToast('لطفاً یک آدرس وارد کنید', 'error');\n    return;\n  }\n\n  btn.disabled = true;\n  btn.textContent = 'در حال دریافت...';\n  area.classList.add('hidden');\n  currentPreview = null;\n  currentVersionId = null;\n\n  try {\n    const preview = await previewUrl(url);\n    currentPreview = preview;\n\n    const q = preview.qualityReport;\n    const levelClass = q.level === 'good' ? 'quality-ok' :\n                       q.level === 'medium' ? 'quality-warn' : 'quality-bad';\n\n    area.innerHTML = `\n      \u003cdiv class=\"card mt-2\">\n        \u003cdiv class=\"card-header\">\n          \u003cdiv>\n            \u003cdiv class=\"card-title\">${escapeHtml(preview.title)}\u003c/div>\n            \u003cdiv class=\"card-meta ltr\">${escapeHtml(preview.finalUrl)}\u003c/div>\n          \u003c/div>\n          \u003cspan class=\"badge ${q.level === 'good' ? 'badge-success' : q.level === 'medium' ? 'badge-warning' : 'badge-danger'}\">\n            امتیاز کیفیت: ${q.score}\n          \u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"quality-report\">\n          \u003cdiv class=\"quality-item\">\n            \u003cspan>طول متن\u003c/span>\n            \u003cspan class=\"${levelClass}\">${q.textLength.toLocaleString('fa-IR')} کاراکتر\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"quality-item\">\n            \u003cspan>وضعیت HTTP\u003c/span>\n            \u003cspan>${q.httpStatus || '—'}\u003c/span>\n          \u003c/div>\n          ${q.warnings.length ? `\n            \u003cdiv class=\"mt-1\">\n              \u003cstrong>هشدارها:\u003c/strong>\n              \u003cul style=\"margin:6px 0 0 16px; padding:0;\">\n                ${q.warnings.map(w => `\u003cli class=\"quality-warn\">${escapeHtml(w)}\u003c/li>`).join('')}\n              \u003c/ul>\n            \u003c/div>\n          ` : '\u003cp class=\"quality-ok mt-1\">هشدار خاصی وجود ندارد\u003c/p>'}\n        \u003c/div>\n\n        \u003cdiv class=\"card-body\" style=\"max-height:240px; overflow-y:auto; white-space:pre-wrap; font-size:0.9rem;\">\n          ${escapeHtml(preview.extractedText.substring(0, 2000))}\n          ${preview.extractedText.length > 2000 ? '…' : ''}\n        \u003c/div>\n\n        \u003cdiv class=\"mt-2 flex gap-1\">\n          \u003cbutton id=\"btn-approve\" class=\"btn btn-primary\">تأیید و افزودن به دانش\u003c/button>\n          \u003cbutton id=\"btn-discard\" class=\"btn btn-secondary\">رد کردن\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    `;\n\n    area.classList.remove('hidden');\n\n    document.getElementById('btn-approve').addEventListener('click', handleApprove);\n    document.getElementById('btn-discard').addEventListener('click', () => {\n      area.classList.add('hidden');\n      currentPreview = null;\n      showToast('پیش‌نمایش رد شد', 'info');\n    });\n\n  } catch (err) {\n    showToast(err.message, 'error', 5000);\n    area.innerHTML = `\n      \u003cdiv class=\"card mt-2\">\n        \u003cdiv class=\"card-body\" style=\"color:var(--danger);\">\n          \u003cstrong>خطا:\u003c/strong> ${escapeHtml(err.message)}\n        \u003c/div>\n      \u003c/div>\n    `;\n    area.classList.remove('hidden');\n  } finally {\n    btn.disabled = false;\n    btn.textContent = 'بررسی و استخراج';\n  }\n}\n\nasync function handleApprove() {\n  if (!currentPreview) return;\n\n  const btn = document.getElementById('btn-approve');\n  btn.disabled = true;\n  btn.textContent = 'در حال ذخیره...';\n\n  try {\n    const { sourceId, versionId } = await savePreview(currentPreview);\n    currentVersionId = versionId;\n\n    // Approve immediately for simplicity in this version\n    await approveVersion(versionId);\n    await indexVersion(versionId);\n\n    showToast('منبع با موفقیت اضافه و ایندکس شد', 'success');\n    document.getElementById('preview-area').innerHTML = `\n      \u003cdiv class=\"card mt-2\">\n        \u003cdiv class=\"card-body text-center\">\n          \u003cp style=\"color:var(--success); font-weight:600;\">✓ منبع تأیید و به پایگاه دانش اضافه شد\u003c/p>\n          \u003ca href=\"/sources\" data-route=\"/sources\" class=\"btn btn-secondary mt-2\">مشاهده منابع\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    `;\n  } catch (err) {\n    showToast(err.message, 'error');\n    btn.disabled = false;\n    btn.textContent = 'تأیید و افزودن به دانش';\n  }\n}\n\nfunction escapeHtml(str) {\n  if (!str) return '';\n  return String(str)\n    .replace(/&/g, '&amp;')\n    .replace(/\u003c/g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}\n","truncated":false},{"path":"js/pages/search.js","size":3091,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Full-text Search Page\n */\nimport { search } from '../services/retriever.js';\nimport { showToast } from '../utils/toast.js';\n\nexport async function renderSearch() {\n  const container = document.getElementById('page-container');\n  container.innerHTML = `\n    \u003cdiv class=\"page-header\">\n      \u003ch1 class=\"page-title\">جستجو در دانش\u003c/h1>\n      \u003cp class=\"page-subtitle\">جستجوی کامل‌متن روی منابع تأییدشده\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"form-group\">\n        \u003cinput type=\"search\" id=\"search-input\" class=\"form-input\"\n               placeholder=\"عبارت مورد نظر را بنویسید...\" />\n      \u003c/div>\n      \u003cbutton id=\"btn-search\" class=\"btn btn-primary btn-block\">جستجو\u003c/button>\n    \u003c/div>\n\n    \u003cdiv id=\"search-results\" class=\"mt-2\">\u003c/div>\n  `;\n\n  const input = document.getElementById('search-input');\n  const btn = document.getElementById('btn-search');\n\n  const doSearch = async () => {\n    const q = input.value.trim();\n    if (!q) return;\n\n    btn.disabled = true;\n    btn.textContent = 'در حال جستجو...';\n    const resultsEl = document.getElementById('search-results');\n    resultsEl.innerHTML = `\u003cdiv class=\"loading-screen\">\u003cdiv class=\"spinner\">\u003c/div>\u003c/div>`;\n\n    try {\n      const { results, mode, total, message } = await search(q, { topK: 12 });\n\n      if (!results.length) {\n        resultsEl.innerHTML = `\n          \u003cdiv class=\"empty-state\">\n            \u003ch3>نتیجه‌ای یافت نشد\u003c/h3>\n            \u003cp>${message || 'عبارت دیگری را امتحان کنید یا منابع بیشتری اضافه کنید.'}\u003c/p>\n          \u003c/div>\n        `;\n        return;\n      }\n\n      resultsEl.innerHTML = `\n        \u003cp class=\"card-meta mb-1\">${total} نتیجه (حالت: ${mode === 'fulltext' ? 'کامل‌متن' : mode})\u003c/p>\n        ${results.map(r => `\n          \u003cdiv class=\"card\">\n            \u003cdiv class=\"card-header\">\n              \u003cdiv>\n                \u003cdiv class=\"card-title\">${escapeHtml(r.sourceTitle)}\u003c/div>\n                \u003cdiv class=\"card-meta\">نسخه ${r.versionNumber} · امتیاز ${r.score?.toFixed(2) || '—'}\u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"card-body\" style=\"font-size:0.9rem;\">\n              ${r.heading ? `\u003cstrong>${escapeHtml(r.heading)}\u003c/strong>\u003cbr>` : ''}\n              ${escapeHtml(r.excerpt)}\n            \u003c/div>\n            ${r.sourceUrl ? `\u003cdiv class=\"card-meta ltr\" style=\"font-size:0.75rem; word-break:break-all;\">${escapeHtml(r.sourceUrl)}\u003c/div>` : ''}\n          \u003c/div>\n        `).join('')}\n      `;\n    } catch (err) {\n      showToast(err.message, 'error');\n      resultsEl.innerHTML = '';\n    } finally {\n      btn.disabled = false;\n      btn.textContent = 'جستجو';\n    }\n  };\n\n  btn.addEventListener('click', doSearch);\n  input.addEventListener('keydown', e => {\n    if (e.key === 'Enter') doSearch();\n  });\n}\n\nfunction escapeHtml(str) {\n  if (!str) return '';\n  return String(str)\n    .replace(/&/g, '&amp;')\n    .replace(/\u003c/g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}\n","truncated":false},{"path":"js/pages/settings.js","size":4899,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Settings Page\n */\nimport {\n  getAllSettings,\n  setSetting,\n  exportAllData,\n  importData,\n  wipeAllData\n} from '../db/db.js';\nimport { showToast } from '../utils/toast.js';\n\nexport async function renderSettings() {\n  const settings = await getAllSettings();\n  const container = document.getElementById('page-container');\n\n  container.innerHTML = `\n    \u003cdiv class=\"page-header\">\n      \u003ch1 class=\"page-title\">تنظیمات\u003c/h1>\n      \u003cp class=\"page-subtitle\">پیکربندی محلی و پشتیبان‌گیری\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-title mb-1\">ظاهر\u003c/div>\n      \u003cdiv class=\"form-group\">\n        \u003clabel class=\"form-label\">پوسته\u003c/label>\n        \u003cselect id=\"theme-select\" class=\"form-select\">\n          \u003coption value=\"auto\" ${settings.theme === 'auto' ? 'selected' : ''}>خودکار (سیستم)\u003c/option>\n          \u003coption value=\"light\" ${settings.theme === 'light' ? 'selected' : ''}>روشن\u003c/option>\n          \u003coption value=\"dark\" ${settings.theme === 'dark' ? 'selected' : ''}>تاریک\u003c/option>\n        \u003c/select>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-title mb-1\">پشتیبان‌گیری و بازیابی\u003c/div>\n      \u003cp class=\"card-meta mb-2\">تمام داده‌ها فقط روی این دستگاه ذخیره می‌شوند. پشتیبان‌گیری منظم توصیه می‌شود.\u003c/p>\n      \u003cdiv class=\"flex gap-1\" style=\"flex-wrap:wrap;\">\n        \u003cbutton id=\"btn-export\" class=\"btn btn-primary\">خروجی پشتیبان (JSON)\u003c/button>\n        \u003clabel class=\"btn btn-secondary\" style=\"cursor:pointer;\">\n          بازیابی از فایل\n          \u003cinput type=\"file\" id=\"import-file\" accept=\".json\" hidden />\n        \u003c/label>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-title mb-1\" style=\"color:var(--danger);\">منطقه خطر\u003c/div>\n      \u003cp class=\"card-meta mb-2\">پاک کردن تمام داده‌ها غیرقابل بازگشت است.\u003c/p>\n      \u003cbutton id=\"btn-wipe\" class=\"btn btn-danger\">پاک کردن تمام دانش\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-title mb-1\">درباره\u003c/div>\n      \u003cdiv class=\"card-body\" style=\"font-size:0.9rem;\">\n        \u003cp>\u003cstrong>دانش خصوصی\u003c/strong> — نسخه کاملاً بدون سرور\u003c/p>\n        \u003cp class=\"mt-1\">تمام پردازش‌ها و ذخیره‌سازی روی دستگاه شما انجام می‌شود.\u003c/p>\n        \u003cp class=\"mt-1 card-meta\">نسخه ۱.۰ · Client-Only PWA\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  `;\n\n  // Theme\n  document.getElementById('theme-select').addEventListener('change', async (e) => {\n    const value = e.target.value;\n    await setSetting('theme', value);\n    applyTheme(value);\n    showToast('پوسته تغییر کرد', 'success');\n  });\n\n  // Export\n  document.getElementById('btn-export').addEventListener('click', async () => {\n    try {\n      const data = await exportAllData();\n      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = `private-knowledge-backup-${new Date().toISOString().slice(0,10)}.json`;\n      a.click();\n      URL.revokeObjectURL(url);\n      showToast('فایل پشتیبان دانلود شد', 'success');\n    } catch (err) {\n      showToast('خطا در خروجی: ' + err.message, 'error');\n    }\n  });\n\n  // Import\n  document.getElementById('import-file').addEventListener('change', async (e) => {\n    const file = e.target.files[0];\n    if (!file) return;\n    try {\n      const text = await file.text();\n      const data = JSON.parse(text);\n      if (!confirm('تمام داده‌های فعلی با محتوای فایل جایگزین می‌شوند. ادامه می‌دهید؟')) return;\n      await importData(data);\n      showToast('بازیابی با موفقیت انجام شد. صفحه را رفرش کنید.', 'success');\n    } catch (err) {\n      showToast('خطا در بازیابی: ' + err.message, 'error');\n    }\n  });\n\n  // Wipe\n  document.getElementById('btn-wipe').addEventListener('click', async () => {\n    if (!confirm('آیا مطمئن هستید؟ تمام منابع، گفتگوها و تنظیمات پاک خواهند شد.')) return;\n    if (!confirm('این عمل غیرقابل بازگشت است. تأیید نهایی؟')) return;\n    try {\n      await wipeAllData();\n      showToast('تمام داده‌ها پاک شدند', 'success');\n      setTimeout(() => location.reload(), 1000);\n    } catch (err) {\n      showToast('خطا: ' + err.message, 'error');\n    }\n  });\n}\n\nexport function applyTheme(theme) {\n  const root = document.documentElement;\n  if (theme === 'auto') {\n    root.removeAttribute('data-theme');\n  } else {\n    root.setAttribute('data-theme', theme);\n  }\n}\n","truncated":false},{"path":"js/pages/sources.js","size":2316,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Sources Library Page\n */\nimport { getSources, getVersions } from '../db/db.js';\nimport { navigate } from '../router.js';\n\nexport async function renderSources() {\n  const sources = await getSources();\n  const container = document.getElementById('page-container');\n\n  if (sources.length === 0) {\n    container.innerHTML = `\n      \u003cdiv class=\"page-header\">\n        \u003ch1 class=\"page-title\">منابع\u003c/h1>\n      \u003c/div>\n      \u003cdiv class=\"empty-state\">\n        \u003cdiv class=\"empty-state-icon\">📚\u003c/div>\n        \u003ch3>هنوز منبعی وجود ندارد\u003c/h3>\n        \u003cp>از بخش «افزودن» یک آدرس وب اضافه کنید.\u003c/p>\n        \u003ca href=\"/ingest\" data-route=\"/ingest\" class=\"btn btn-primary mt-2\">افزودن منبع\u003c/a>\n      \u003c/div>\n    `;\n    return;\n  }\n\n  let html = `\n    \u003cdiv class=\"page-header\">\n      \u003ch1 class=\"page-title\">منابع دانش\u003c/h1>\n      \u003cp class=\"page-subtitle\">${sources.length} منبع\u003c/p>\n    \u003c/div>\n  `;\n\n  for (const s of sources) {\n    const versions = await getVersions(s.id);\n    const approved = versions.filter(v => v.approved);\n\n    html += `\n      \u003cdiv class=\"card\" data-source-id=\"${s.id}\">\n        \u003cdiv class=\"card-header\">\n          \u003cdiv style=\"flex:1;\">\n            \u003cdiv class=\"card-title\">${escapeHtml(s.title || 'بدون عنوان')}\u003c/div>\n            \u003cdiv class=\"card-meta ltr\" style=\"word-break:break-all;\">${escapeHtml(s.finalUrl || s.url)}\u003c/div>\n          \u003c/div>\n          \u003cspan class=\"badge ${s.status === 'active' ? 'badge-success' : 'badge-warning'}\">\n            ${s.status === 'active' ? 'فعال' : 'در انتظار'}\n          \u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-body\">\n          \u003cdiv class=\"card-meta\">\n            نسخه‌ها: ${versions.length} |\n            تأییدشده: ${approved.length} |\n            آخرین به‌روزرسانی: ${formatDate(s.updatedAt)}\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    `;\n  }\n\n  container.innerHTML = html;\n}\n\nfunction formatDate(ts) {\n  if (!ts) return '—';\n  return new Date(ts).toLocaleDateString('fa-IR', {\n    year: 'numeric', month: 'short', day: 'numeric'\n  });\n}\n\nfunction escapeHtml(str) {\n  if (!str) return '';\n  return String(str)\n    .replace(/&/g, '&amp;')\n    .replace(/\u003c/g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;');\n}\n","truncated":false},{"path":"js/router.js","size":2244,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Lightweight client-side router using History API\n */\n\nconst routes = {};\nlet currentRoute = null;\nlet pageContainer = null;\n\nexport function initRouter(containerSelector = '#page-container') {\n  pageContainer = document.querySelector(containerSelector);\n  if (!pageContainer) throw new Error('Page container not found');\n\n  // Intercept link clicks\n  document.addEventListener('click', (e) => {\n    const link = e.target.closest('[data-route]');\n    if (link) {\n      e.preventDefault();\n      navigate(link.getAttribute('data-route'));\n    }\n  });\n\n  // Handle browser back/forward\n  window.addEventListener('popstate', () => {\n    render(window.location.pathname);\n  });\n\n  // Initial render\n  render(window.location.pathname || '/');\n}\n\nexport function register(path, handler) {\n  routes[path] = handler;\n}\n\nexport function navigate(path) {\n  if (path === currentRoute) return;\n  window.history.pushState({}, '', path);\n  render(path);\n}\n\nasync function render(path) {\n  // Normalize\n  path = path.split('?')[0];\n  if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);\n\n  currentRoute = path;\n\n  // Update nav active state\n  document.querySelectorAll('.nav-item').forEach(item => {\n    const route = item.getAttribute('data-route');\n    item.classList.toggle('active', route === path);\n  });\n\n  const handler = routes[path] || routes['/404'] || routes['/'];\n\n  if (!handler) {\n    pageContainer.innerHTML = `\u003cdiv class=\"empty-state\">\u003ch3>صفحه یافت نشد\u003c/h3>\u003c/div>`;\n    return;\n  }\n\n  // Show loading\n  pageContainer.innerHTML = `\n    \u003cdiv class=\"loading-screen\">\n      \u003cdiv class=\"spinner\">\u003c/div>\n      \u003cp>در حال بارگذاری...\u003c/p>\n    \u003c/div>\n  `;\n\n  try {\n    const content = await handler();\n    if (typeof content === 'string') {\n      pageContainer.innerHTML = content;\n    }\n    // If handler returns nothing, it is expected to have rendered itself\n  } catch (err) {\n    console.error('Route error', err);\n    pageContainer.innerHTML = `\n      \u003cdiv class=\"empty-state\">\n        \u003cdiv class=\"empty-state-icon\">⚠️\u003c/div>\n        \u003ch3>خطا در بارگذاری صفحه\u003c/h3>\n        \u003cp>${err.message}\u003c/p>\n      \u003c/div>\n    `;\n  }\n}\n\nexport function getCurrentRoute() {\n  return currentRoute;\n}\n","truncated":false},{"path":"js/services/chunker.js","size":1908,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Heading-aware text chunker\n */\nexport function chunkText(text, options = {}) {\n  const {\n    chunkSize = 500,\n    chunkOverlap = 80\n  } = options;\n\n  if (!text || text.length === 0) return [];\n\n  // Split by headings first (simple heuristic)\n  const headingRegex = /^(#{1,6}\\s+.+|[A-Z][^\\n]{10,80})\\n/gm;\n  const sections = [];\n  let lastIndex = 0;\n  let match;\n\n  // Simple paragraph-based chunking (more reliable without full markdown)\n  const paragraphs = text.split(/\\n\\s*\\n/).filter(p => p.trim().length > 0);\n\n  const chunks = [];\n  let current = '';\n  let currentHeading = null;\n\n  for (const para of paragraphs) {\n    const trimmed = para.trim();\n\n    // Detect possible heading\n    const isHeading = trimmed.length \u003c 100 &&\n      (trimmed.endsWith(':') || /^[۰-۹0-9]+\\./.test(trimmed) || trimmed === trimmed.toUpperCase());\n\n    if (isHeading && current.length > 0) {\n      // flush current\n      chunks.push({\n        heading: currentHeading,\n        text: current.trim(),\n        startOffset: 0,\n        endOffset: current.length\n      });\n      current = '';\n      currentHeading = trimmed;\n    } else if (isHeading) {\n      currentHeading = trimmed;\n    }\n\n    if (current.length + trimmed.length + 1 > chunkSize && current.length > 0) {\n      chunks.push({\n        heading: currentHeading,\n        text: current.trim(),\n        startOffset: 0,\n        endOffset: current.length\n      });\n\n      // overlap\n      const words = current.split(/\\s+/);\n      const overlapWords = words.slice(-Math.floor(chunkOverlap / 5));\n      current = overlapWords.join(' ') + '\\n\\n' + trimmed;\n    } else {\n      current = current ? current + '\\n\\n' + trimmed : trimmed;\n    }\n  }\n\n  if (current.trim()) {\n    chunks.push({\n      heading: currentHeading,\n      text: current.trim(),\n      startOffset: 0,\n      endOffset: current.length\n    });\n  }\n\n  return chunks.filter(c => c.text.length > 30);\n}\n","truncated":false},{"path":"js/services/ingestion.js","size":6523,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Client-side URL Ingestion Engine\n */\nimport { validateUrl } from '../utils/url-validator.js';\nimport { sha256 } from '../utils/hash.js';\nimport {\n  createSource,\n  createVersion,\n  updateSource,\n  getSource\n} from '../db/db.js';\n\nconst MAX_RESPONSE_SIZE = 2 * 1024 * 1024; // 2 MB\nconst FETCH_TIMEOUT = 15000;\n\n/**\n * Extract main content using a simple readability-like approach\n * (In production you would load Mozilla Readability via import)\n */\nfunction extractContent(html, url) {\n  const parser = new DOMParser();\n  const doc = parser.parseFromString(html, 'text/html');\n\n  // Remove unwanted elements\n  const removeSelectors = [\n    'script', 'style', 'noscript', 'iframe', 'nav', 'footer',\n    'header', 'aside', '.sidebar', '.nav', '.menu', '.advertisement',\n    '.ads', '#comments', '.comment', '[role=\"navigation\"]'\n  ];\n  removeSelectors.forEach(sel => {\n    doc.querySelectorAll(sel).forEach(el => el.remove());\n  });\n\n  // Try article or main first\n  let contentEl = doc.querySelector('article') ||\n                  doc.querySelector('main') ||\n                  doc.querySelector('[role=\"main\"]') ||\n                  doc.querySelector('.post-content') ||\n                  doc.querySelector('.entry-content') ||\n                  doc.body;\n\n  const title = doc.querySelector('title')?.textContent?.trim() ||\n                doc.querySelector('h1')?.textContent?.trim() ||\n                url;\n\n  // Get text with some structure\n  const text = contentEl.innerText || contentEl.textContent || '';\n  const cleanText = text\n    .replace(/\\n{3,}/g, '\\n\\n')\n    .replace(/[ \\t]+/g, ' ')\n    .trim();\n\n  return {\n    title: title.substring(0, 300),\n    text: cleanText,\n    length: cleanText.length\n  };\n}\n\n/**\n * Generate quality report\n */\nfunction buildQualityReport(extracted, httpStatus, contentType) {\n  const report = {\n    httpStatus,\n    contentType,\n    textLength: extracted.length,\n    hasTitle: !!extracted.title && extracted.title.length > 5,\n    warnings: [],\n    score: 100\n  };\n\n  if (extracted.length \u003c 200) {\n    report.warnings.push('متن استخراج‌شده بسیار کوتاه است');\n    report.score -= 40;\n  } else if (extracted.length \u003c 500) {\n    report.warnings.push('متن نسبتاً کوتاه است');\n    report.score -= 15;\n  }\n\n  if (!report.hasTitle) {\n    report.warnings.push('عنوان معتبری یافت نشد');\n    report.score -= 10;\n  }\n\n  if (httpStatus && httpStatus >= 400) {\n    report.warnings.push(`کد وضعیت HTTP: ${httpStatus}`);\n    report.score -= 30;\n  }\n\n  if (contentType && !contentType.includes('text/html') && !contentType.includes('text/plain')) {\n    report.warnings.push(`نوع محتوا پشتیبانی محدود دارد: ${contentType}`);\n    report.score -= 20;\n  }\n\n  report.score = Math.max(0, report.score);\n  report.level = report.score >= 70 ? 'good' : report.score >= 40 ? 'medium' : 'poor';\n\n  return report;\n}\n\n/**\n * Fetch and extract a URL\n */\nexport async function previewUrl(rawUrl) {\n  const validation = validateUrl(rawUrl);\n  if (!validation.valid) {\n    throw new Error(validation.error);\n  }\n\n  const controller = new AbortController();\n  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);\n\n  try {\n    const response = await fetch(validation.url, {\n      method: 'GET',\n      signal: controller.signal,\n      redirect: 'follow',\n      headers: {\n        'Accept': 'text/html,application/xhtml+xml,text/plain;q=0.9,*/*;q=0.8'\n      }\n    });\n\n    clearTimeout(timeoutId);\n\n    const contentType = response.headers.get('content-type') || '';\n    const contentLength = parseInt(response.headers.get('content-length') || '0', 10);\n\n    if (contentLength > MAX_RESPONSE_SIZE) {\n      throw new Error('حجم صفحه بیش از حد مجاز است (۲ مگابایت)');\n    }\n\n    const buffer = await response.arrayBuffer();\n    if (buffer.byteLength > MAX_RESPONSE_SIZE) {\n      throw new Error('حجم صفحه بیش از حد مجاز است');\n    }\n\n    const decoder = new TextDecoder('utf-8');\n    const html = decoder.decode(buffer);\n\n    const extracted = extractContent(html, validation.url);\n    const contentHash = await sha256(extracted.text);\n    const qualityReport = buildQualityReport(extracted, response.status, contentType);\n\n    return {\n      requestedUrl: rawUrl,\n      finalU /\nexport async function search(query, options = {}) {\n  const { topK = 6 } = options;\n\n  if (!miniSearch) {\n    await buildIndex();\n  }\n\n  if (!miniSearch || miniSearch.documentCount === 0) {\n    return {\n      results: [],\n      mode: 'empty',\n      message: 'هنوز دانشی تأیید نشده است'\n    };\n  }\n\n  const results = miniSearch.search(query, { combineWith: 'AND' });\n\n  // Enrich with source info\n  const enriched = [];\n  for (const r of results.slice(0, topK)) {\n    const version = await getVersion(r.versionId);\n    const source = await getSource(r.sourceId);\n    enriched.push({\n      chunkId: r.id,\n      versionId: r.versionId,\n      sourceId: r.sourceId,\n      score: r.score,\n      heading: r.heading,\n      text: r.text,\n      excerpt: r.text.substring(0, 280) + (r.text.length > 280 ? '…' : ''),\n      sourceTitle: source?.title || version?.title || 'بدون عنوان',\n      sourceUrl: source?.finalUrl || version?.finalUrl,\n      retrievedAt: version?.retrievedAt,\n      versionNumber: version?.versionNumber\n    });\n  }\n\n  return {\n    results: enriched,\n    mode: 'fulltext',\n    total: results.length\n  };\n}\n\n/**\n * Get context string for LLM prompt\n */\nexport function buildContext(results) {\n  if (!results.length) return '';\n\n  return results.map((r, i) => {\n    return `[${i + 1}] منبع: ${r.sourceTitle} (نسخه ${r.versionNumber})\\n${r.excerpt}`;\n  }).join('\\n\\n');\n}\n","truncated":false},{"path":"js/utils/hash.js","size":578,"mime":"text/javascript","ext":"js","kind":"text","text":"/**\n * Simple content hashing using Web Crypto\n */\nexport async function sha256(text) {\n  const encoder = new TextEncoder();\n  const data = encoder.encode(text);\n  const hashBuffer = await crypto.subtle.digest('SHA-256', data);\n  const hashArray = Array.from(new Uint8Array(hashBuffer));\n  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');\n}\n\nexport function simpleHash(str) {\n  let hash = 0;\n  for (let i = 0; i = parsed.hostname;\n\n  for (const pattern of PRIVATE_IP_RANGES) {\n    if (pattern.test(hostname)) {\n      result.error = 'آدرس‌های محلی و خصوصی مجاز نیستند';\n      return result;\n    }\n  }\n\n  // Block obvious metadata endpoints\n  if (hostname === 'metadata.google.internal' ||\n      hostname.endsWith('.internal') ||\n      hostname === '169.254.169.254') {\n    result.error = 'آدرس‌های داخلی و متادیتا مجاز نیستند';\n    return result;\n  }\n\n  result.valid = true;\n  result.url = parsed.href;\n  return result;\n}\n","truncated":false},{"path":"manifest.webmanifest","size":1035,"mime":"application/octet-stream","ext":"webmanifest","kind":"binary"},{"path":"README.md","size":3235,"mime":"text/markdown","ext":"md","kind":"text","text":"# دانش خصوصی — Private Knowledge AI (Client-Only)\n\nنسخه **کاملاً بدون سرور** سیستم دانش شخصی.\n\n- تمام داده‌ها فقط در IndexedDB مرورگر ذخیره می‌شوند\n- هیچ بک‌اند یا دیتابیس خارجی وجود ندارد\n- قابل نصب به عنوان PWA روی آیفون (Add to Home Screen)\n- رابط فارسی‌محور (RTL)\n\n## قابلیت‌های پیاده‌سازی‌شده\n\n- SPA واقعی با History API\n- PWA (manifest + service worker)\n- ذخیره‌سازی نسخه‌دار منابع در IndexedDB (Dexie)\n- استخراج محتوا از URL (با محدودیت CORS مرورگر)\n- گزارش کیفیت استخراج + تأیید دستی\n- Chunking و Full-text Search (MiniSearch)\n- گفتگو مبتنی بر شواهد (استخراجی)\n- جستجوی کامل‌متن\n- خروجی / بازیابی پشتیبان JSON\n- پوسته روشن / تاریک\n- طراحی موبایل‌اول برای iPhone\n\n## محدودیت‌های مهم (صادقانه)\n\n1. **CORS**: بسیاری از سایت‌ها اجازه `fetch` مستقیم از مرورگر را نمی‌دهند. در این موارد استخراج شکست می‌خورد.\n2. **محافظت SSRF**: در محیط کلاینت محافظت واقعی ممکن نیست.\n3. **مدل زبانی**: در این نسخه پایه از پاسخ استخراجی استفاده شده. برای تولید واقعی می‌توان WebLLM اضافه کرد.\n4. **حجم ذخیره‌سازی**: محدود به سهمیه IndexedDB مرورگر.\n5. **Jobهای پس‌زمینه**: محدود به قابلیت‌های Service Worker.\n\n## نحوه اجرا\n\n### روش ساده (توصیه‌شده برای تست)\n\nچون اپ از ES Modules و مسیرهای absolute استفاده می‌کند، باید با یک HTTP server محلی اجرا شود:\n\n```bash\ncd private-knowledge-pwa\nnpx serve .\n# یا\npython3 -m http.server 8080\n```\n\nسپس در مرورگر به آدرس نشان‌داده‌شده بروید (معمولاً http://localhost:3000 یا 8080).\n\n### نصب روی آیفون\n\n1. اپ را روی یک هاست HTTPS قرار دهید (یا از سرویس‌هایی مثل ngrok / Cloudflare Tunnel استفاده کنید).\n2. در Safari آدرس را باز کنید.\n3. دکمه Share → Add to Home Screen.\n4. اپ به صورت مستقل باز می‌شود.\n\n## ساختار پروژه\n\n```\nprivate-knowledge-pwa/\n├── index.html\n├── manifest.webmanifest\n├── sw.js\n├── css/\n├── js/\n│   ├── app.js\n│   ├── router.js\n│   ├── db/\n│   ├── services/\n│   ├── pages/\n│   └── utils/\n├── icons/\n└── README.md\n```\n\n## توسعه بعدی پیشنهادی\n\n- اضافه کردن WebLLM برای پاسخ تولیدی واقعی\n- Transformers.js برای embedding و جستجوی برداری\n- PIN lock با Web Crypto\n- Diff بین نسخه‌ها\n- بهبود استخراج با Mozilla Readability (از طریق bundle)\n\n## مجوز\n\nاین کد برای استفاده شخصی و آموزشی ارائه شده است.\n","truncated":false},{"path":"sw.js","size":1929,"mime":"text/javascript","ext":"js","kind":"text","text":"const CACHE_NAME = 'private-knowledge-v1';\nconst STATIC_ASSETS = [\n  '/',\n  '/index.html',\n  '/manifest.webmanifest',\n  '/css/base.css',\n  '/css/themes.css',\n  '/css/components.css',\n  '/css/rtl.css',\n  '/js/app.js',\n  '/js/router.js',\n  '/js/db/db.js',\n  '/js/db/schema.js',\n  '/icons/icon-192.png',\n  '/icons/icon-512.png'\n];\n\n// Install\nself.addEventListener('install', (event) => {\n  event.waitUntil(\n    caches.open(CACHE_NAME).then((cache) => {\n      return cache.addAll(STATIC_ASSETS).catch(err => {\n        console.warn('Some assets failed to cache', err);\n      });\n    })\n  );\n  self.skipWaiting();\n});\n\n// Activate\nself.addEventListener('activate', (event) => {\n  event.waitUntil(\n    caches.keys().then((keys) => {\n      return Promise.all(\n        keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))\n      );\n    })\n  );\n  self.clients.claim();\n});\n\n// Fetch strategy: Network first for HTML, Cache first for static\nself.addEventListener('fetch', (event) => {\n  const url = new URL(event.request.url);\n\n  // Never cache API-like or external requests\n  if (url.origin !== self.location.origin) {\n    return; // let browser handle\n  }\n\n  // For navigation requests → network first, fallback to cache\n  if (event.request.mode === 'navigate') {\n    event.respondWith(\n      fetch(event.request)\n        .then(res => {\n          const clone = res.clone();\n          caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));\n          return res;\n        })\n        .catch(() => caches.match('/index.html'))\n    );\n    return;\n  }\n\n  // Static assets → cache first\n  event.respondWith(\n    caches.match(event.request).then((cached) => {\n      return cached || fetch(event.request).then((res) => {\n        if (res.ok) {\n          const clone = res.clone();\n          caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));\n        }\n        return res;\n      });\n    })\n  );\n});\n","truncated":false}],"select":"README.md"}</script>
