<!DOCTYPE html><html lang="en" data-theme="dark"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="description" content="ALI — Adaptive Learning &amp; Intelligence. Personal evidence-centered knowledge engine.">
  <title>ALI — Adaptive Learning &amp; Intelligence</title>
  
  <link rel="stylesheet" href="/static/css/app.css">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style data-anyhtml="">html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}</style></head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo">ALI</span>
        <span class="tag">Knowledge Engine</span>
      </div>
      <nav>
        <button data-view="dashboard" class="nav-item active">Dashboard</button>
        <button data-view="import" class="nav-item">Import</button>
        <button data-view="library" class="nav-item">Library</button>
        <button data-view="search" class="nav-item">Search</button>
        <button data-view="answer" class="nav-item">Ask</button>
        <button data-view="tools" class="nav-item">Tools</button>
        <button data-view="settings" class="nav-item">Settings</button>
      </nav>
      <div class="sidebar-footer">
        <button id="lang-toggle" class="ghost" title="Toggle language">EN / FA</button>
        <button id="theme-toggle" class="ghost" title="Toggle theme">Theme</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn" aria-label="Menu">☰</button>
        <h1 id="view-title">Dashboard</h1>
        <div class="status-pill" id="health-pill">…</div>
      </header>

      <section id="view-dashboard" class="view active">
        <div class="cards">
          <div class="card"><h3>Documents</h3><p class="metric" id="m-docs">—</p></div>
          <div class="card"><h3>Chunks</h3><p class="metric" id="m-chunks">—</p></div>
          <div class="card"><h3>Scores</h3><p class="metric" id="m-scores">—</p></div>
          <div class="card"><h3>Imports</h3><p class="metric" id="m-imports">—</p></div>
        </div>
        <div class="panel">
          <h2>System</h2>
          <pre id="diag-out" class="code-block">Loading…</pre>
        </div>
      </section>

      <section id="view-import" class="view">
        <div class="tabs">
          <button class="tab active" data-tab="file">File</button>
          <button class="tab" data-tab="url">URL</button>
          <button class="tab" data-tab="text">Text</button>
        </div>
        <div id="tab-file" class="tab-panel active">
          <form id="form-file" class="form">
            <label>Choose file (txt, md, csv, json, pdf, html)</label>
            <input type="file" id="file-input" accept=".txt,.md,.markdown,.csv,.json,.pdf,.html,.htm">
            <label>Optional title</label>
            <input type="text" id="file-title" placeholder="Title">
            <button type="submit" class="primary">Ingest File</button>
          </form>
        </div>
        <div id="tab-url" class="tab-panel">
          <form id="form-url" class="form">
            <label>Public URL</label>
            <input type="url" id="url-input" placeholder="https://example.com/article" required="">
            <label>Optional title</label>
            <input type="text" id="url-title" placeholder="Title">
            <button type="submit" class="primary">Ingest URL</button>
          </form>
        </div>
        <div id="tab-text" class="tab-panel">
          <form id="form-text" class="form">
            <label>Paste text</label>
            <textarea id="text-input" rows="10" placeholder="Paste content here…" required=""></textarea>
            <label>Optional title</label>
            <input type="text" id="text-title" placeholder="Title">
            <button type="submit" class="primary">Ingest Text</button>
          </form>
        </div>
        <div id="import-result" class="panel hidden"></div>
      </section>

      <section id="view-library" class="view">
        <div class="toolbar">
          <button id="refresh-lib" class="ghost">Refresh</button>
        </div>
        <div id="lib-list" class="list"></div>
      </section>

      <section id="view-search" class="view">
        <form id="form-search" class="form inline">
          <input type="search" id="search-q" placeholder="Search knowledge base…" required="">
          <select id="search-lang">
            <option value="">Any language</option>
            <option value="en">English</option>
            <option value="fa">Persian</option>
          </select>
          <button type="submit" class="primary">Search</button>
        </form>
        <div id="search-results" class="list"></div>
      </section>

      <section id="view-answer" class="view">
        <form id="form-answer" class="form">
          <label>Question</label>
          <textarea id="answer-q" rows="3" placeholder="Ask a question grounded in your knowledge base…" required=""></textarea>
          <button type="submit" class="primary">Get Evidence-Based Answer</button>
        </form>
        <div id="answer-out" class="panel hidden"></div>
      </section>

      <section id="view-tools" class="view">
        <div id="tools-list" class="list"></div>
      </section>

      <section id="view-settings" class="view">
        <div class="panel">
          <h2>Configuration</h2>
          <p>Embeddings and OCR are disabled by default in this environment (resource constraints).</p>
          <p>API documentation: <a href="/api/docs" target="_blank">/api/docs</a></p>
          <button id="btn-backup" class="primary">Create Database Backup</button>
          <pre id="settings-out" class="code-block"></pre>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/js/app.js"></script>


</body></html>
